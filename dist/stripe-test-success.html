<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Resultado del pago de prueba · BRC Studio</title><style>body{font:16px system-ui;max-width:560px;margin:10vh auto;padding:24px;color:#17233c;line-height:1.6}a{display:inline-block;margin-top:16px;color:#1549bb}#status{padding:18px;background:#f3f5f8;border-radius:12px}</style></head><body><h1>Resultado del pago de prueba</h1><p id="status" role="status">Verificando el pago con Stripe…</p><p><strong>Entorno de prueba: no se ha cobrado dinero real.</strong></p><a href="/stripe-test.html">Volver a pruebas de Stripe</a><script>(async()=>{const el=document.getElementById('status');const id=new URLSearchParams(location.search).get('session_id');if(!id){el.textContent='No hay sesión que verificar.';return}try{const r=await fetch('/api/stripe-test-status?session_id='+encodeURIComponent(id),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error('No se ha podido verificar la sesión.');if(d.paid){const euros=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(d.amount/100);el.textContent='Pago de prueba confirmado por Stripe. Plan: '+d.plan+'. Importe: '+euros+'.';}else{el.textContent='El pago todavía no consta como completado en Stripe.'}}catch(e){el.textContent='No se ha podido verificar el pago. Consulta el panel de Stripe.'}})();</script></body></html>
