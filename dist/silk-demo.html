<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRC Studio · Silk Scroll Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:white;font-family:Arial,sans-serif}header{position:fixed;z-index:3;top:0;left:0;right:0;padding:28px 6vw;display:flex;justify-content:space-between;font-size:13px;letter-spacing:.13em}.scroll{height:350vh}.scene{position:sticky;top:0;height:100svh;overflow:hidden;background:#050505}.scene video,.fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.fallback{background:url('https://cdn.openart.ai/openart-uploads/production/attachment-transfers/c0668c40bf2203f161b0e0b36e20533ef402cdf38ef8eed3b2aa5ee5725262fb.jpg') center/cover}.scene video{filter:contrast(1.08)}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#050505 0%,transparent 30%,transparent 75%,#050505);pointer-events:none}.text{position:absolute;z-index:2;inset:0;display:flex;flex-direction:column;justify-content:center;padding:7vw;pointer-events:none}.text small{letter-spacing:.2em;color:#aaa;margin-bottom:20px}.text h1{font-size:clamp(55px,9vw,150px);font-weight:500;letter-spacing:-.085em;line-height:.92;margin:0}.end{opacity:0;justify-content:end;padding-bottom:12vh}.end h1{font-size:clamp(70px,12vw,160px)}footer{height:55vh;display:grid;place-items:center;color:#888}@media(max-width:700px){.scene:after{background:linear-gradient(0deg,#050505,transparent 28%,transparent 83%,#050505)}.text{padding:25px}}@media(prefers-reduced-motion:reduce){video{display:none}}</style></head><body><header><strong>BRC STUDIO</strong><span>DEMO · SEDA</span></header><div class="scroll" id="scroll"><section class="scene"><div class="fallback"></div><video id="video" muted playsinline preload="metadata" poster="https://cdn.openart.ai/openart-uploads/production/attachment-transfers/c0668c40bf2203f161b0e0b36e20533ef402cdf38ef8eed3b2aa5ee5725262fb.jpg" disablepictureinpicture aria-hidden="true" src="https://cdn.openart.ai/openart-ai/production/2026-10/create-video/7T7oWZrVYzDMdw7L9953/FNPFJfzwXFp3CBV7mqkUP_minimax-h3_1791672891460_eb5ba344.mp4"></video><div class="text" id="intro"><small>DISEÑO DIGITAL CON INTENCIÓN</small><h1>Diseñamos<br>lo que viene.</h1></div><div class="text end" id="outro"><small>SELECCIÓN DE TRABAJOS</small><h1>Proyectos.</h1></div></section></div><footer>La forma sigue a la idea.</footer><script>(()=>{const v=document.querySelector('#video'),s=document.querySelector('#scroll'),a=document.querySelector('#intro'),b=document.querySelector('#outro');let p=0,d=5.184,last=-1;v.muted=true;v.pause();v.addEventListener('loadedmetadata',()=>{d=v.duration||d;v.pause()});v.addEventListener('play',()=>v.pause());document.addEventListener('touchstart',()=>{if(v.readyState<2){v.load()}},{once:true,passive:true});function frame(){const rect=s.getBoundingClientRect(),range=Math.max(1,s.offsetHeight-innerHeight),target=Math.max(0,Math.min(1,-rect.top/range));p+=(target-p)*.2;const t=Math.max(0,Math.min(d-.04,p*d));if(v.readyState>=1&&Math.abs(last-t)>.03){try{v.currentTime=t;last=t}catch{}}a.style.opacity=Math.max(0,Math.min(1,(.94-p)/.08));b.style.opacity=Math.max(0,Math.min(1,(p-.94)/.06));a.style.transform='translateY('+(-p*Math.min(innerHeight*.55,500))+'px)';b.style.transform='translateY('+((1-p)*60)+'px)';requestAnimationFrame(frame)}if(!matchMedia('(prefers-reduced-motion: reduce)').matches)frame();else{a.style.opacity=0;b.style.opacity=1}})()</script></body></html>
