<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BRC Studio · Pruebas de Stripe</title><style>body{font:16px system-ui;max-width:560px;margin:48px auto;padding:20px;color:#17233c}button{display:block;margin:12px 0;padding:14px 18px;border:0;border-radius:9px;background:#17233c;color:white;font:inherit;width:100%}#result{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:#f3f5f8;border-radius:9px}a{color:#1549bb}</style></head><body><h1>Stripe · Prueba interna</h1><p>Solo entorno de prueba. No se realizan cobros reales.</p><button data-plan="mensual">Comprobar plan mensual (227,48 €)</button><button data-plan="compra">Comprobar compra (592,90 €)</button><div id="result" role="status">Selecciona una prueba.</div><script>document.querySelectorAll('button').forEach(b=>b.addEventListener('click',async()=>{const out=document.getElementById('result');out.textContent='Comprobando…';try{const response=await fetch('/api/stripe-test-checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan:b.dataset.plan})});const data=await response.json();if(!response.ok||!data.url||data.livemode!==false)throw Error(data.error||'Respuesta inesperada');out.replaceChildren(document.createTextNode('Sesión de prueba creada correctamente. '));const link=document.createElement('a');link.href=data.url;link.textContent='Abrir Checkout de prueba';link.rel='noopener noreferrer';out.append(link);}catch(e){out.textContent='Error: '+e.message;}}));</script></body></html>
